<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSK Hotel Booking App</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --accent: #F59E0B;
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: #0B1329;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      position: relative;
      padding-bottom: 70px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1E1B4B, #312E81);
      padding: 20px 16px;
      border-bottom: 1px solid #3730A3;
    }

    header h1 {
      font-size: 1.4rem;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Filter Bar */
    .filter-bar {
      padding: 12px 16px;
      background: var(--card-bg);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #334155;
    }

    .chip {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
    }

    /* Hotel List */
    .hotel-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hotel-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .hotel-image {
      height: 140px;
      width: 100%;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .hotel-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: bold;
    }

    .hotel-details {
      padding: 14px;
    }

    .hotel-details h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .hotel-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .hotel-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #10B981;
    }

    .price span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .btn-book {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-book:hover {
      background: var(--primary-dark);
    }

    /* Booking Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #FFF;
      font-size: 0.9rem;
    }

    .summary-box {
      background: #0F172A;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .summary-row.total {
      font-weight: bold;
      border-top: 1px solid #334155;
      padding-top: 6px;
      color: #10B981;
    }

    .btn-submit {
      width: 100%;
      background: #10B981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Confirmation Banner */
    .alert {
      display: none;
      padding: 12px;
      margin: 16px;
      background: #064E3B;
      border: 1px solid #10B981;
      border-radius: 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>🏨 StayFinder Kirinyaga</h1>
      <p>CSK Hackathon Challenge - Mobile Booking App</p>
    </header>

    <div class="filter-bar">
      <button class="chip active" onclick="filterHotels('all')">All</button>
      <button class="chip" onclick="filterHotels('budget')">Budget (&lt; 3k)</button>
      <button class="chip" onclick="filterHotels('luxury')">Luxury</button>
      <button class="chip" onclick="filterHotels('gardens')">Gardens & Venues</button>
    </div>

    <div id="booking-alert" class="alert"></div>

    <div class="hotel-list" id="hotel-list">
      <!-- Dynamic rendering via JS -->
    </div>
  </div>

  <!-- Booking Modal -->
  <div class="modal" id="booking-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Book Room</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <form id="booking-form" onsubmit="confirmBooking(event)">
        <div class="form-group">
          <label for="guest-name">Full Name</label>
          <input type="text" id="guest-name" required placeholder="e.g. John Doe">
        </div>

        <div class="form-group">
          <label for="check-in">Check-in Date</label>
          <input type="date" id="check-in" required onchange="calculateTotal()">
        </div>

        <div class="form-group">
          <label for="nights">Number of Nights</label>
          <input type="number" id="nights" min="1" value="1" required onchange="calculateTotal()">
        </div>

        <div class="summary-box">
          <div class="summary-row">
            <span>Rate / Night:</span>
            <span id="summary-rate">Ksh 0</span>
          </div>
          <div class="summary-row total">
            <span>Total Payable:</span>
            <span id="summary-total">Ksh 0</span>
          </div>
        </div>

        <button type="submit" class="btn-submit">Confirm & Book</button>
      </form>
    </div>
  </div>

  <script>
    const hotels = [
      {
        id: 1,
        name: "RosaBlu Hotel Kutus",
        location: "Kutus Town",
        price: 2052,
        rating: "4.2 ★",
        category: "budget",
        image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        name: "Roswam Hotel",
        location: "Kutus-Kerugoya Road",
        price: 2249,
        rating: "4.2 ★ (4-Star)",
        category: "budget",
        image: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        name: "Sifa Gardens",
        location: "Kutus (1 km from town)",
        price: 3500,
        rating: "4.5 ★ (Event & Lodging)",
        category: "gardens",
        image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        name: "Bekam Hotel",
        location: "Kirinyaga Central",
        price: 4361,
        rating: "3.8 ★ (3-Star)",
        category: "luxury",
        image: "https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        name: "The Lagoon Resort & Spa",
        location: "Kirinyaga Suburbs",
        price: 6340,
        rating: "4.2 ★ (Resort)",
        category: "luxury",
        image: "https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        name: "ABAI Lodges & Spa",
        location: "Kirinyaga Scenic Route",
        price: 16931,
        rating: "4.4 ★ (4-Star Luxury)",
        category: "luxury",
        image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let selectedHotel = null;

    function renderHotels(data) {
      const list = document.getElementById("hotel-list");
      list.innerHTML = "";
      data.forEach(hotel => {
        list.innerHTML += `
          <div class="hotel-card">
            <div class="hotel-image" style="background-image: url('${hotel.image}')">
              <span class="hotel-badge">${hotel.rating}</span>
            </div>
            <div class="hotel-details">
              <h3>${hotel.name}</h3>
              <p class="hotel-location">📍 ${hotel.location}</p>
              <div class="hotel-meta">
                <div class="price">Ksh ${hotel.price.toLocaleString()} <span>/ night</span></div>
                <button class="btn-book" onclick="openModal(${hotel.id})">Book Now</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterHotels(category) {
      document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderHotels(hotels);
      } else if (category === 'budget') {
        renderHotels(hotels.filter(h => h.price < 3000));
      } else {
        renderHotels(hotels.filter(h => h.category === category));
      }
    }

    function openModal(hotelId) {
      selectedHotel = hotels.find(h => h.id === hotelId);
      document.getElementById("modal-title").innerText = `Book ${selectedHotel.name}`;
      document.getElementById("summary-rate").innerText = `Ksh ${selectedHotel.price.toLocaleString()}`;
      
      // Default to today's date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("check-in").value = today;
      document.getElementById("nights").value = 1;
      
      calculateTotal();
      document.getElementById("booking-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("booking-modal").classList.remove("open");
    }

    function calculateTotal() {
      if (!selectedHotel) return;
      const nights = parseInt(document.getElementById("nights").value) || 1;
      const total = selectedHotel.price * nights;
      document.getElementById("summary-total").innerText = `Ksh ${total.toLocaleString()}`;
    }

    function confirmBooking(event) {
      event.preventDefault();
      const name = document.getElementById("guest-name").value;
      const nights = document.getElementById("nights").value;
      const total = selectedHotel.price * parseInt(nights);

      const bookingAlert = document.getElementById("booking-alert");
      bookingAlert.style.display = "block";
      bookingAlert.innerHTML = `✅ <strong>Booking Confirmed!</strong><br>Thank you, ${name}. Your reservation at <strong>${selectedHotel.name}</strong> for ${nights} night(s) totaling <strong>Ksh ${total.toLocaleString()}</strong> is complete.`;

      closeModal();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initial render
    renderHotels(hotels);
  </script>
</body>
</html>
